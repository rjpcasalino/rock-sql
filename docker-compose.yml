version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rock-sql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./seeds:/seeds:ro
      - ./deploy/docker/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explorer -d astronomy"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
